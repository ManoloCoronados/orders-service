spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
app.kafka.topics.order-created=${KAFKA_TOPIC_ORDERS_CREATED}


spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.kafka.producer.acks=${KAFKA_PRODUCER_ACKS}
spring.kafka.producer.batch-size=${KAFKA_PRODUCER_BATCH_SIZE}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=${KAFKA_PRODUCER_LINGER_MS}
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}
app.outbox.metrics.refresh-interval-ms=${OUTBOX_METRICS_REFRESH_INTERVAL_MS}
spring.application.name=orders-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.jpa.open-in-view=false
app.outbox.relay.workers=${OUTBOX_RELAY_WORKERS}
app.outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE}
app.outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_INTERVAL_MS}
app.outbox.relay.lease-seconds=${OUTBOX_RELAY_LEASE_SECONDS}
app.outbox.relay.publish-timeout-ms=${OUTBOX_RELAY_PUBLISH_TIMEOUT_MS}
app.outbox.relay.max-attempts=${OUTBOX_RELAY_MAX_ATTEMPTS}
app.outbox.relay.backoff-base-ms=${OUTBOX_RELAY_BACKOFF_BASE_MS}
app.outbox.relay.backoff-max-ms=${OUTBOX_RELAY_BACKOFF_MAX_MS}
app.outbox.relay.shutdown-await-seconds=${OUTBOX_RELAY_SHUTDOWN_AWAIT_SECONDS}
app.outbox.retention-days=${OUTBOX_RETENTION_DAYS}